data:
  train_images: "dataset/train/images"
  train_masks: "dataset/train/D_mask"
  val_images: "dataset/val/images"
  val_masks: "dataset/val/D_mask"

model:
  encoder_name: "resnet101"
  encoder_weights: "imagenet"
  in_channels: 3

training:
  batch_size: 16
  num_epochs: 50
  learning_rate: 0.0001
  num_classes: 3
  patience: 100
  save_base_dir: "out"
